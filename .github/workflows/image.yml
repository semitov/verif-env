# Builds the verification image, tests it, and publishes it to the GitHub
# Container Registry as ghcr.io/semitov/semitov-verif-env.
#
# Runs when anything in docker/ changes on main, or by hand from the Actions tab.
# The first run takes about an hour: the arm64 half (for Apple Silicon Macs)
# is built under emulation. Later runs reuse the build cache and are much faster.

name: Build verification image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/semitov-verif-env" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build the x86 image locally and test it before publishing anything.
      - name: Build (amd64, for testing)
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          load: true
          tags: semitov-verif-env:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tool check
        run: docker run --rm semitov-verif-env:ci check-tools

      - name: Hello-world tests (simulation with waveform, formal, Spike)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CCACHE_DIR=/tmp/ccache \
            -v "$PWD":/work -w /work semitov-verif-env:ci bash -c '
              set -e
              make -C tests/hello WAVES=1
              test -s tests/hello/dump.fst
              make -C tests/hello formal
              spike --isa=rv32i "$RISCV_TESTS/isa/rv32ui-p-add"
            '

      # 2. Build both architectures (x86 reuses the cache) and publish.
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
